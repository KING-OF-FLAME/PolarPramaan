name: Snapshot real sources

# Fetches permitted source material from official providers (NSIDC, PANGAEA,
# NASA, OpenAlex, Wikimedia, US-government pages; NCPOR metadata only) and
# commits the hashed snapshot + manifest back to the branch that triggered it.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated provider steps to refresh (empty = all)'
        required: false
        default: ''
  push:
    paths:
      - 'scripts/snapshot/**'
      - '.github/workflows/snapshot-sources.yml'

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch sources
        # A push re-runs only the step(s) listed here; workflow_dispatch can refresh any/all.
        run: node scripts/snapshot/fetch-sources.mjs --only="$ONLY"
        env:
          ONLY: ${{ github.event_name == 'push' && 'policies,ncpor' || inputs.only }}
      - name: Commit snapshot
        run: |
          git config user.name "polarpramaan-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: refresh real source snapshot ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
